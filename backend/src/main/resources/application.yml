spring:
  application:
    name: realtime-transit-backend
  profiles:
    default: local
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/realtime_transit}
    username: ${DB_USERNAME:transit}
    password: ${DB_PASSWORD:transit}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:transit}
      timeout: 2s
      connect-timeout: 2s
  cache:
    type: redis
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.realtimetransit.backend.transit.entity,com.realtimetransit.backend.provider.entity,com.realtimetransit.backend.journey.entity
  type-handlers-package: com.realtimetransit.backend.common.mybatis
  configuration:
    map-underscore-to-camel-case: true
    use-column-label: true
    jdbc-type-for-null: 'NULL'
    default-statement-timeout: 10
    shrink-whitespaces-in-sql: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

journey:
  default-target-probability: 0.8000
  session-ttl: 30m
  location-ttl: 10m
  max-location-future-skew: 5s
  walking-detour-factor: 1.20
  departure-preparation-time: 10s
  boarding-buffer: 15s
  default-vehicle-eta-uncertainty: 45s
  prediction-ttl: 2m
  decision-refresh-interval: 1m
  fresh-location-threshold: 30s
  usable-location-threshold: 2m
  high-accuracy-threshold-m: 20.00
  medium-accuracy-threshold-m: 50.00
  default-slow-walk-speed-mps: 0.90
  default-walk-speed-mps: 1.30
  default-fast-walk-speed-mps: 1.70
  default-run-speed-mps: 2.50

transit:
  arrival:
    observation-freshness: 2m
  maintenance:
    interval: 10m
    observation-retention: 24h
    batch-size: 1000
  api-quota:
    seoul-subway-daily-limit: ${SEOUL_SUBWAY_DAILY_CALL_BUDGET:800}
    gbis-daily-limit: ${GBIS_DAILY_CALL_BUDGET:800}
    national-precision-bus-daily-limit: ${NATIONAL_PRECISION_BUS_DAILY_CALL_BUDGET:4000}
    railway-timetable-daily-limit: ${KRIC_DAILY_CALL_BUDGET:5000}
  providers:
    gbis:
      base-url: https://apis.data.go.kr
      service-key: ${GBIS_SERVICE_KEY:}
    national-precision-bus:
      base-url: ${NATIONAL_PRECISION_BUS_BASE_URL:https://apis.data.go.kr/B551982/rte}
      service-key: ${NATIONAL_PRECISION_BUS_SERVICE_KEY:}
    seoul-subway:
      base-url: ${SEOUL_SUBWAY_BASE_URL:http://swopenAPI.seoul.go.kr/api/subway}
      reference-base-url: ${SEOUL_OPEN_DATA_BASE_URL:http://openapi.seoul.go.kr:8088}
      service-key: ${SEOUL_SUBWAY_SERVICE_KEY:}
      reference-service-key: ${SEOUL_SUBWAY_REFERENCE_SERVICE_KEY:${SEOUL_SUBWAY_SERVICE_KEY:}}
    railway-timetable:
      base-url: ${KRIC_BASE_URL:https://openapi.kric.go.kr/openapi}
      service-key: ${KRIC_SERVICE_KEY:}
      holiday-dates: ${KRIC_HOLIDAY_DATES:}
