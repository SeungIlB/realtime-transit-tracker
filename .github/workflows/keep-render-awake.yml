name: Keep Render Backend Warm

on:
  schedule:
    # Render 무료 플랜의 절전 전환(약 15분) 전에 하루 종일 깨워 둔다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Check backend liveness
        run: >-
          curl
          --fail
          --silent
          --show-error
          --retry 2
          --retry-all-errors
          --max-time 90
          https://realtime-transit-backend.onrender.com/actuator/health/liveness
