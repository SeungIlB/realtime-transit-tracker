name: Keep Render Backend Warm

on:
  schedule:
    # KST 06:00~10:00 (UTC 21:00~01:00, 자정 경계로 분리)
    - cron: "*/10 21-23 * * *"
    - cron: "*/10 0-1 * * *"
    # KST 17:00~22:00 (UTC 08:00~13:00)
    - cron: "*/10 8-13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Check backend liveness
        run: >-
          curl
          --fail
          --silent
          --show-error
          --retry 2
          --retry-all-errors
          --max-time 90
          https://realtime-transit-backend.onrender.com/actuator/health/liveness
