name: Keep Render Backend Warm

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Check backend liveness
        run: >-
          curl
          --fail
          --silent
          --show-error
          --retry 2
          --retry-all-errors
          --max-time 90
          https://realtime-transit-backend.onrender.com/actuator/health/liveness
